# Checks every push and pull request, so that a failure shows up when it is
# made rather than when a release is tagged.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: |
          npx tsc --noEmit -p .
          npx tsc -p schema/docs

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      # The schema is generated from the types and committed; a change to the
      # types that was not followed by `npm run build:schema` fails here.
      - name: Build, schema up to date
        run: |
          npm run build
          git diff --exit-code -- src/schema.json

      - name: Smoke test of the built package
        run: npm run smoke
