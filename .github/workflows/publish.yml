# Publishes the package to npm, on a tag v* or by hand from the Actions tab.
# Run by hand, it also tags the commit it published with v and the version,
# so a release made where tags cannot be pushed is tagged all the same. A
# version on npm already is not published again, so running it by hand on a
# release that went out untagged tags it and does nothing else.
#
# One thing is set up outside this file: on npm, linked-rolls has
# pfefferniels/linked-rolls, workflow publish.yml, as a trusted publisher,
# so no token is stored anywhere and every release carries provenance.

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: The tag names the version in package.json
        if: github.ref_type == 'tag'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # prepublishOnly builds and runs the tests first.
      - name: Publish, unless the version is on npm already
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "linked-rolls@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "linked-rolls@$version is on npm already"
          else
            npm publish --access public
          fi

  # Apart from publishing, so that nothing npm installs or runs ever holds a
  # token that can write to the repository. A tag pushed with that token
  # starts no workflow, so it does not publish a second time.
  tag:
    needs: publish
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag the published commit
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
