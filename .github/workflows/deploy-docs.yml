name: Deploy Schema Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The emulator is a file: dependency, expected one level up under the
      # name the local checkout still carries; see publish.yml.
      - name: Check out welte-t100
        uses: actions/checkout@v4
        with:
          repository: pfefferniels/welte-t100
          path: welte-t100
      - name: Put it where the dependency looks for it
        run: |
          mkdir -p ../roll-nuance-tracer
          ln -s "$GITHUB_WORKSPACE/welte-t100" ../roll-nuance-tracer/emulator

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Build schema
        run: npm run build:schema

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the format docs
        run: |
          pip install json-schema-for-humans
          mkdir -p docs
          generate-schema-doc --config expand_buttons=true --config with_footer=false src/schema.json docs/index.html
          python .github/postprocess-docs.py docs/index.html

      # The ontology lives at /reo/, the type vocabulary at /reo/type/,
      # which is the layout the w3id.org redirects will point at.
      - name: Generate the ontology docs
        run: |
          pip install pylode
          mkdir -p docs/reo/type/welte-t100 docs/reo/welte-t100
          pylode ontology/reo.ttl -o docs/reo/index.html
          pylode ontology/types.ttl -o docs/reo/type/index.html
          pylode ontology/systems/welte-t100.ttl -o docs/reo/type/welte-t100/index.html

      - name: Publish the ontology files and the contexts
        run: |
          cp ontology/reo.ttl ontology/types.ttl docs/reo/
          cp ontology/systems/welte-t100.ttl docs/reo/type/welte-t100/
          cp src/spec/context.json docs/reo/context.jsonld
          cp src/spec/welte-t100.context.json docs/reo/welte-t100/context.jsonld

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
